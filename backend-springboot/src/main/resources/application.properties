spring.application.name=application

# Biến môi trường nhận diện profile, mặc định là 'local' nếu không truyền gì
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Cấu hình JPA / Hibernate chung
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.session.jdbc.initialize-schema=always

# Flyway Configuration
spring.flyway.baseline-on-migrate=true


# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Thời gian hết hạn JWT
jwt.expiration=86400000
jwt.refresh.expiration=604800000

# Spring Mail Configuration
spring.mail.host=${MAIL_HOST:${SPRING_MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${MAIL_PORT:${SPRING_MAIL_PORT:587}}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:doanngocduc2006@gmail.com}}
app.mail.sender-name=${MAIL_SENDER_NAME:Nhà xe Ralsei}

