apiVersion: apps/v1
kind: Deployment
metadata:
  name: ralsei-mssql
  labels:
    app.kubernetes.io/name: ralsei-mssql
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ralsei-mssql
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ralsei-mssql
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: ralsei-mssql
          image: ralsei-db:0.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ralsei-be-runtime
                  key: SPRING_DATASOURCE_PASSWORD
          ports:
            - name: mssql
              containerPort: 1433
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: mssql
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: mssql
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ralsei-mssql
  labels:
    app.kubernetes.io/name: ralsei-mssql
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: 1433
      targetPort: 1433
      name: mssql
  selector:
    app.kubernetes.io/name: ralsei-mssql
    app.kubernetes.io/component: database
