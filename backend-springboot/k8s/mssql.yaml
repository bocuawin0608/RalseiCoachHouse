apiVersion: apps/v1
kind: Deployment
metadata:
  name: ralsei-mssql
  labels:
    app.kubernetes.io/name: ralsei-mssql
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ralsei-mssql
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ralsei-mssql
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: ralsei-mssql
          image: ralsei-db:0.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ralsei-be-runtime
                  key: SPRING_DATASOURCE_PASSWORD
          ports:
            - name: mssql
              containerPort: 1433
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
# KHÔNG DÙNG tcpSocket CHO DATABASE NỮA
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                # Gọi công cụ sqlcmd có sẵn trong container MSSQL
                # Cờ -b cực kỳ quan trọng: Ép sqlcmd trả về mã lỗi (exit code 1) nếu query thất bại
                - /opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P "$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -d master -t 3
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P "$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -d master -t 3
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ralsei-mssql
  labels:
    app.kubernetes.io/name: ralsei-mssql
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: 1433
      targetPort: 1433
      name: mssql
  selector:
    app.kubernetes.io/name: ralsei-mssql
    app.kubernetes.io/component: database
