server.port=8083
spring.application.name=staff-service

# DataSource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=staff_db;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Feign URLs
customer.service.url=http://localhost:8081
driver.service.url=http://localhost:8082
auth.service.url=http://localhost:8080

# JWT Config
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# Sepay & Goong Third-Party Integrations
sepay.api.token=${SEPAY_API_TOKEN:}
sepay.bank.account=${SEPAY_BANK_ACCOUNT:SBSEPAYP1FG3GSWHJU9}
sepay.bank.name=${SEPAY_BANK_NAME:Vietcombank}
goong.api.key=${GOONG_API_KEY:}
goong.api.url=${GOONG_API_URL:https://rsapi.goong.io/v2/geocode}
firebase.service-account-key=${FIREBASE_SERVICE_ACCOUNT_KEY:firebase-service-account.json}

# Spring Mail Configuration
spring.mail.host=${MAIL_HOST:${SPRING_MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${MAIL_PORT:${SPRING_MAIL_PORT:587}}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.sender-name=${MAIL_SENDER_NAME:Nhà xe Ralsei}
