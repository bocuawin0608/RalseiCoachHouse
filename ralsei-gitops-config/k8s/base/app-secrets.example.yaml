# Example application secrets template. Do not commit actual credentials.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "<change-me-db-password>"
  JWT_SECRET: "<change-me-jwt-256bit-secret>"
  SEPAY_API_TOKEN: "<optional-sepay-token>"
  GOONG_API_KEY: "<optional-goong-key>"

