
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: app-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - ./data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - /opt/mssql-tools18/bin/sqlcmd
        - -S
        - localhost
        - -U
        - sa
        - -P
        - ${MSSQL_SA_PASSWORD}
        - -C
        - -Q
        - SELECT 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: app-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    volumes:
      - ./init:/init:ro
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -euo pipefail
        SQLCMD=/opt/mssql-tools18/bin/sqlcmd

        for file in \
          /init/01_ddl_vexedb.sql \
          /init/02_procedure_vexedb.sql \
          /init/03_fakedata_vexedb.sql \
          /init/init_auth_db.sql \
          /init/init_customer_db.sql \
          /init/init_driver_db.sql \
          /init/init_staff_db.sql
        do
          echo "Executing $$file"
          "$$SQLCMD" \
            -S sqlserver \
            -U sa \
            -P "$$MSSQL_SA_PASSWORD" \
            -C -b -l 30 \
            -i "$$file"
        done

        echo "All database initialization scripts completed."
    restart: "no"
