server.port=8084
spring.application.name=driver-service

# Database Configuration (VeXeDB)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=VeXeDB;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:01102006Duc.}}
spring.datasource.driver-className=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway Configuration
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JWT Settings
jwt.secret=${JWT_SECRET:856a9ee1487e41d4f230d5af0cbacdd01e3261d2aa92f36cd9ca6ccca5cb104b}
jwt.expiration=86400000

# Feign Client Settings
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
feign.staff-service.url=${STAFF_SERVICE_URL:http://localhost:8083}
feign.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}
staff.service.url=${STAFF_SERVICE_URL:http://localhost:8083}
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}
