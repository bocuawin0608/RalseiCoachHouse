server.port=8082
spring.application.name=customer-service

# Database Config
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=customer_db;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình JPA / Hibernate chung
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.session.jdbc.initialize-schema=always
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Flyway Configuration
spring.flyway.baseline-on-migrate=true

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Redis Config
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT Config
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000
jwt.refresh.expiration=604800000

# Spring Mail Configuration
spring.mail.host=${MAIL_HOST:${SPRING_MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${MAIL_PORT:${SPRING_MAIL_PORT:587}}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.sender-name=${MAIL_SENDER_NAME:Nhà xe Ralsei}

# Sepay
sepay.api.token=${SEPAY_API_TOKEN:}
sepay.bank.account=${SEPAY_BANK_ACCOUNT:SBSEPAYP1FG3GSWHJU9}
sepay.bank.name=${SEPAY_BANK_NAME:Vietcombank}

# Feign Clients
staff.service.url=http://localhost:8083
driver.service.url=http://localhost:8084
auth.service.url=http://localhost:8081
