server.port=8081
spring.application.name=auth-service

# DataSource Config (SQL Server)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=VeXeDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:01102006Duc.}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Config
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# Flyway
spring.flyway.enabled=false

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# JWT
jwt.secret=${JWT_SECRET:856a9ee1487e41d4f230d5af0cbacdd01e3261d2aa92f36cd9ca6ccca5cb104b}
jwt.expiration=3600000
jwt.refresh.expiration=86400000

# Feign Client URLs
customer.service.url=${CUSTOMER_SERVICE_URL:http://localhost:8082}
staff.service.url=${STAFF_SERVICE_URL:http://localhost:8083}
